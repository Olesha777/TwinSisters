# =============================================================================
# TwinSisters — конфигурация моделей
# =============================================================================
#
# Каждая модель — отдельный блок со своими характеристиками.
# Новую модель скачал — добавил блок, всё. В код не лезешь.
#
# Поля:
#   file            — имя .gguf файла в папке models/
#   chat_format     — формат чата (chatml, llama3, mistral, phi3)
#   n_ctx           — размер контекста в токенах
#   n_threads       — число потоков CPU
#   n_batch         — размер батча для prompt evaluation
#   max_tokens      — максимум токенов в ответе
#   temperature     — температура генерации (выше = креативнее, ниже = точнее)
#   top_p           — nucleus sampling (1.0 = выключен)
#   top_k           — top-k sampling (0 = выключен)
#   repeat_penalty  — штраф за повторения (1.0 = выключен)
#   enable_thinking — разрешить модели "думать" (Qwen3: блоки размышлений)
#
# Параметр default — имя модели, которая загружается при старте.
# =============================================================================

models:
  qwen3-1.7b:
    file: "qwen3-1.7b-q4_k_m.gguf"
    chat_format: "chatml"
    n_ctx: 3072
    n_threads: 4
    n_batch: 512
    max_tokens: 384
    temperature: 0.7
    top_p: 0.95
    top_k: 40
    repeat_penalty: 1.15
    enable_thinking: false

default: "qwen3-1.7b"
